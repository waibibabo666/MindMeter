<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="MindMeter 心智镜：本机认知测评。8 个维度、三档时长、分维度参考，不设总分，数据不出这台设备。"
    />
    <title>MindMeter · 心智镜</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">跳到主要内容</a>

    <div class="app-shell">
      <header class="topbar">
        <span class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <circle cx="32" cy="32" r="27" stroke="currentColor" stroke-width="2.6" opacity=".4" />
            <circle
              class="mark-ring"
              cx="32"
              cy="32"
              r="27"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-dasharray="2.5 7"
              opacity=".65"
            />
            <path d="M32 14 L14 32 L32 50 Z" fill="currentColor" fill-opacity=".3" />
            <path
              d="M32 14 L50 32 L32 50 Z"
              fill="currentColor"
              fill-opacity=".08"
              stroke="currentColor"
              stroke-opacity=".6"
              stroke-width="1.6"
            />
            <line
              x1="32"
              y1="11"
              x2="32"
              y2="53"
              stroke="currentColor"
              stroke-opacity=".35"
              stroke-width="1.2"
              stroke-dasharray="2 3"
            />
          </svg>
          <span class="brand-name">MindMeter<span class="brand-sub">心智镜</span></span>
        </span>
        <span class="chip" id="chip" role="status"></span>
        <span class="topbar-right">
          <button class="toplink-btn" id="quit-task" type="button" hidden>退出测评</button>
          <button
            class="toplink-btn icon-btn"
            id="toggle-nav"
            type="button"
            aria-pressed="false"
            title="收起 / 展开左侧菜单"
          >
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none">
              <rect
                x="1.5"
                y="2.5"
                width="13"
                height="11"
                rx="2"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span class="sr-only">收起或展开左侧菜单</span>
          </button>
          <button
            class="toplink-btn icon-btn"
            id="toggle-rail"
            type="button"
            aria-pressed="false"
            title="收起 / 展开右侧快捷操作栏"
          >
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none">
              <rect
                x="1.5"
                y="2.5"
                width="13"
                height="11"
                rx="2"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <line x1="10" y1="2.5" x2="10" y2="13.5" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span class="sr-only">收起或展开右侧快捷操作栏</span>
          </button>
          <a class="toplink" href="#/settings">设置</a>
          <button class="toplink-btn quit-app" id="quit-app" type="button">退出</button>
        </span>
      </header>

      <div class="wb">
        <nav class="sidebar" id="sidebar" aria-label="主导航">
          <a class="navitem" href="#/tier" data-nav="测评">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M22 12h-4l-3 8-4-16-3 8H2" />
            </svg>
            测评
          </a>
          <a class="navitem" href="#/report" data-nav="报告">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 3v18h18" />
              <path d="M7 16v-4" />
              <path d="M12 16V6" />
              <path d="M17 16v-7" />
            </svg>
            报告
          </a>
          <a class="navitem" href="#/games" data-nav="游戏">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M6.5 7h11a4.5 4.5 0 0 1 4.4 3.7l.8 4.6a3.4 3.4 0 0 1-3.4 4L17 16.5H7L4.7 19.3a3.4 3.4 0 0 1-3.4-4l.8-4.6A4.5 4.5 0 0 1 6.5 7z"
              />
              <path d="M7.5 10.5h2.6m-1.3-1.3v2.6" />
              <circle cx="15.4" cy="10.2" r=".9" fill="currentColor" stroke="none" />
              <circle cx="17.4" cy="12.4" r=".9" fill="currentColor" stroke="none" />
            </svg>
            游戏
          </a>
          <a class="navitem" href="#/chat" data-nav="对话">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.9-5.2a8.4 8.4 0 0 1-.8-3.8 8.4 8.4 0 0 1 8.4-9h.5a8.4 8.4 0 0 1 8 8z"
              />
            </svg>
            对话
          </a>
          <a class="navitem" href="#/memory" data-nav="记忆">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
            记忆
          </a>
          <a class="navitem" href="#/trend" data-nav="趋势">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M22 7l-8.5 8.5-4-4L2 19" />
              <path d="M16 7h6v6" />
            </svg>
            趋势
          </a>
          <a class="navitem" href="#/about" data-nav="说明">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 7v14" />
              <path
                d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"
              />
            </svg>
            说明
          </a>
          <a class="navitem" href="#/settings" data-nav="设置">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" />
            </svg>
            设置
          </a>
          <p class="sidefoot">本机运行 · 数据不出这台电脑<br />课程演示版 · 非临床诊断</p>
        </nav>

        <main id="app" tabindex="-1" aria-live="polite"></main>

        <aside class="rail" id="rail" aria-label="快捷操作与说明"></aside>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
