name: 缺陷报告
description: 报告可复现的缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在 Issue 中粘贴真实用户数据、作答原文或密钥。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 一句话说明发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请附截图或日志（脱敏）
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 浏览器/系统/设备/网络/版本
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 阻断（无法使用/数据丢失/安全）
        - P1 严重（核心流程受损）
        - P2 一般
        - P3 轻微
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实用户数据、密钥与个人信息
          required: true
