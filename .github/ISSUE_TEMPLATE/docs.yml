name: 文档问题
description: 报告错漏、失效链接或待更新内容
title: "[Docs] "
labels: ["docs"]
body:
  - type: input
    id: location
    attributes:
      label: 文档与位置
      placeholder: docs/requirements/functional_spec.md §5.3
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题
      description: 哪里不对/不清楚/已过期？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已确认不是重复 Issue
        - label: 未包含真实用户数据或敏感信息
