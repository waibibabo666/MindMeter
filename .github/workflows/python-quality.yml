name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check . --output-format=github
      - name: Format check
        run: ruff format --check . || true

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Install backend deps (if any)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "暂无 requirements.txt，跳过后端依赖"
          fi
      - name: Run tests
        run: |
          # 后端尚未落地时，用例会被 skip，pytest 返回 5（没有收集到用例），不算失败
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "暂无可执行用例（后端模块未落地），按跳过处理"
            exit 0
          fi
          exit "$code"
