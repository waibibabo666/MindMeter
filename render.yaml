# Render Blueprint: MindMeter as a standard web app.
#
# How to use it (full walkthrough: docs/software/deploy-render.md):
#   1. push this repo to GitHub;
#   2. Render dashboard -> New -> Blueprint -> pick the repo;
#   3. on the confirmation screen fill in ``MM_LLM_API_KEY`` (the only value
#      that must not live in git);
#   4. deploy. The service and the Postgres instance are created together and
#      the internal connection string is wired automatically.
#
# Both plans are `free` so a course demo costs nothing. Free caveats are
# documented: the web service sleeps after 15 idle minutes (first request then
# takes ~1 min), the filesystem is ephemeral, and a free Postgres expires 30
# days after creation. Switch both `plan:` values to `starter` for a link that
# stays alive; no other change is needed.
services:
  - type: web
    name: mindmeter-web
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    healthCheckPath: /api/v1/health/live
    buildCommand: python -m pip install -r requirements.txt
    # Migrations run before the new version starts serving (idempotent:
    # `MM_AUTO_MIGRATE=1` also upgrades the schema once at startup, which is
    # what a manual "New Web Service" install without this blueprint needs).
    preDeployCommand: cd code/backend && alembic upgrade head
    startCommand: cd code/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: MM_DATABASE_URL
        fromDatabase:
          name: mindmeter-db
          property: connectionString
      # --- site-provided LLM (OpenAI-compatible /chat/completions) ---------
      # 2026-11-20 实测：glm-4.7-flash 免费池常过载（HTTP 429 / code 1305），
      # glm-4-flash-250414 与 glm-4-air-250414 稳定秒回，因此以前者为主、其余为备用链。
      # 过载时后端会先指数退避重试，再按 MM_LLM_MODEL_FALLBACKS 顺序降级，
      # 全链失败才回退模板（详见 docs/software/deploy-render.md §2/§4）。
      # DeepSeek：base https://api.deepseek.com/v1, model deepseek-v4-flash
      # 阿里百炼：base https://dashscope.aliyuncs.com/compatible-mode/v1, model qwen-turbo
      - key: MM_LLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: MM_LLM_MODEL
        value: glm-4-flash-250414
      - key: MM_LLM_MODEL_FALLBACKS
        value: glm-4-air-250414,glm-4.5-flash,glm-4.7-flash
      - key: MM_LLM_API_KEY
        sync: false
        value: ""
      # --- behaviour -------------------------------------------------------
      - key: MM_RAG_MODE
        value: keyword
      - key: MM_DATA_DIR
        value: /tmp/mindmeter
      - key: MM_AUTO_MIGRATE
        value: "1"
      - key: MM_ALLOW_REGISTRATION
        value: "true"
      - key: MM_COOKIE_SECURE
        value: auto
      - key: MM_EXPOSE_LOGS
        value: "false"

databases:
  - name: mindmeter-db
    databaseName: mindmeter
    plan: free
    region: oregon
    postgresMajorVersion: 17
    extensions:
      - name: vector
